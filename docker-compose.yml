services:
  postgres:
    image: postgres:16-alpine
    container_name: adaptive-lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adaptive
      POSTGRES_PASSWORD: adaptive_secret
      POSTGRES_DB: adaptive_lms
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adaptive -d adaptive_lms']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
